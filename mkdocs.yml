site_name: Python EnOcean
site_description: EnOcean serial protocol (ESP3) and equipment profiles (EEP) for Python
site_url: https://j5lien.github.io/enocean/
repo_url: https://github.com/j5lien/enocean
repo_name: j5lien/enocean
edit_uri: edit/main/docs/
# Included in pages with pymdownx.snippets, not pages themselves
exclude_docs: |
  examples/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - Devices and decoding: guides/devices.md
      - Controlling actuators: guides/actuators.md
      - Teach-in: guides/teach-in.md
      - Profiles: guides/profiles.md
      - Monitoring and logs: guides/monitoring.md
      - Development: guides/development.md
  - Migration: migration.md
  - API reference:
      - enocean: reference/enocean.md
      - Communicators: reference/communicators.md
      - Packets: reference/packets.md
      - Profiles (EEP): reference/eep.md
      - Devices and actuators: reference/devices.md
      - Statistics, health, Prometheus: reference/monitoring.md
      - Constants and utilities: reference/constants.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters: ['!^_']

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs/examples, .]
      check_paths: true

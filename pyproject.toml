[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enocean"
version = "1.0.0"
description = "EnOcean serial protocol (ESP3) and equipment profiles (EEP) implementation"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
license = { file = "LICENSE" }
authors = [{ name = "Kimmo Huoman", email = "kipenroskaposti@gmail.com" }]
maintainers = [{ name = "Julien Gobillot" }]
keywords = ["enocean", "esp3", "eep", "home-automation", "serial"]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/j5lien/enocean"
Repository = "https://github.com/j5lien/enocean"
Issues = "https://github.com/j5lien/enocean/issues"
Upstream = "https://github.com/kipe/enocean"

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.13",
    "types-pyserial>=3.5.0.20260712",
]

[tool.setuptools]
packages = ["enocean", "enocean.protocol", "enocean.communicators"]
script-files = ["examples/enocean_example.py"]

[tool.setuptools.package-data]
"enocean" = ["py.typed"]
"enocean.protocol" = ["EEP.xml"]

[tool.pytest.ini_options]
testpaths = ["enocean"]
addopts = "-q"
filterwarnings = [
    # A crash in a communicator thread must fail the test, not just warn
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["enocean"]
omit = ["*/tests/*"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "I", "UP", "B", "SIM"]
# printf-style formatting is kept (also what logging uses)
ignore = ["UP031"]

[tool.ruff.lint.isort]
known-first-party = ["enocean"]
known-local-folder = ["conftest"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
files = ["enocean"]
exclude = ["/tests/"]
strict = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enocean"
version = "0.60.1"
description = "EnOcean serial protocol implementation"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Home Automation",
]
license = { file = "LICENSE" }
authors = [{ name = "Kimmo Huoman", email = "kipenroskaposti@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "enum-compat>=0.0.2",
    "pyserial>=3.0",
    "beautifulsoup4>=4.3.2",
]

[project.urls]
Homepage = "https://github.com/kipe/enocean"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.13",
]

[tool.setuptools]
packages = ["enocean", "enocean.protocol", "enocean.communicators"]
script-files = ["examples/enocean_example.py"]

[tool.setuptools.package-data]
"enocean.protocol" = ["EEP.xml"]

[tool.pytest.ini_options]
testpaths = ["enocean"]
addopts = "-q"

[tool.coverage.run]
source = ["enocean"]
relative_files = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

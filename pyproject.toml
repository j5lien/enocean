[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enocean"
version = "2.1.0"
description = "EnOcean serial protocol (ESP3) and equipment profiles (EEP) implementation"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
license = { file = "LICENSE" }
authors = [{ name = "Kimmo Huoman", email = "kipenroskaposti@gmail.com" }]
maintainers = [{ name = "Julien Gobillot" }]
keywords = ["enocean", "esp3", "eep", "home-automation", "serial"]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
prometheus = ["prometheus-client>=0.17"]

[project.urls]
Homepage = "https://github.com/j5lien/enocean"
Repository = "https://github.com/j5lien/enocean"
Issues = "https://github.com/j5lien/enocean/issues"
Upstream = "https://github.com/kipe/enocean"

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "mypy>=2.3.1",
    "prometheus-client>=0.17",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.13",
    "types-pyserial>=3.5.0.20260712",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.setuptools]
packages = ["enocean", "enocean.protocol", "enocean.communicators"]

[tool.setuptools.package-data]
"enocean" = ["py.typed"]
"enocean.protocol" = ["profiles/*.xml"]

[tool.pytest.ini_options]
testpaths = ["enocean", "hardware_tests"]
# Hardware tests need a real EnOcean stick (configured in .env): `make test-hardware`
addopts = "-q -m 'not hardware'"
markers = [
    "hardware: needs a real EnOcean USB stick configured in .env",
    "interactive: asks the user to act on a real device (e.g. press a switch)",
]
filterwarnings = [
    # A crash in a communicator thread must fail the test, not just warn
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["enocean"]
omit = ["*/tests/*"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
# The pages include examples with pymdownx.snippets markers (--8<--) that ruff format would mangle
extend-exclude = ["docs/**/*.md"]
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "I", "UP", "B", "SIM", "D"]
# printf-style formatting is kept (also what logging uses)
ignore = ["UP031", "D105", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["enocean"]
known-local-folder = ["conftest", "stick"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Docstrings are required on the package's public API only
"**/tests/**" = ["D"]
"hardware_tests/**" = ["D"]
"examples/**" = ["D"]
"tools/**" = ["D"]
"generate_supported_profiles.py" = ["D"]
"docs/**" = ["D"]

[tool.mypy]
files = ["enocean"]
exclude = ["/tests/"]
strict = true
